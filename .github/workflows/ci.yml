# CI: lint, typecheck, coverage-gated tests, and lib build (JS/TS side),
# plus a Rust job that fmt-checks, clippy-lints, and tests the Cargo
# workspace (which now includes the `skillkeeper` Tauri app crate).
# Runs on every push to main/develop and on all pull requests.

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # These jobs take one to three minutes; anything near this bound is stuck,
    # and failing then beats holding a runner for the six-hour default.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch LFS blobs (png/ttf/woff2): the icon generator and the font
          # assets read real bytes, not the LFS pointer text.
          lfs: true
          # Check out examples/test-repo, the end-to-end fixture. Nothing here
          # compiles or lints against it, but keeping it present means any job
          # can drive the CLI against a real working tree without a separate
          # fetch step. Its remote is an SSH URL; actions/checkout rewrites
          # github.com SSH to authenticated HTTPS, so no deploy key is needed
          # for this public repository.
          submodules: true

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Set up Node.js 22 with pnpm cache
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate localization catalogs
        # The .ts (renderer) and .mo (Rust) catalogs are generated from
        # locales/*.po and are not committed. postinstall already runs this on
        # install, but do it explicitly so generation never silently depends on
        # the install lifecycle firing or on cache state.
        run: pnpm run i18n

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test with coverage (90% gate)
        # vitest run --coverage enforces the thresholds defined in vitest.config.ts.
        # The build fails if lines or branches fall below 90%.
        run: pnpm test:cov

      - name: Build libraries
        run: pnpm build:libs

  rust:
    name: Rust fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch LFS blobs (png/ttf/woff2): the icon generator and the font
          # assets read real bytes, not the LFS pointer text.
          lfs: true
          # Check out examples/test-repo, the end-to-end fixture. Nothing here
          # compiles or lints against it, but keeping it present means any job
          # can drive the CLI against a real working tree without a separate
          # fetch step. Its remote is an SSH URL; actions/checkout rewrites
          # github.com SSH to authenticated HTTPS, so no deploy key is needed
          # for this public repository.
          submodules: true

      # The Cargo workspace includes the `skillkeeper` Tauri app crate, which
      # links against the system WebKitGTK/libsoup stack, so that stack must be
      # present for `cargo clippy`/`cargo test` to compile it on ubuntu.
      # libwebkit2gtk-4.1-dev matches Tauri v2's default webview backend and
      # pulls the javascriptcoregtk-4.1 and libsoup-3.0 dev packages with it.
      #
      # This job compiles and tests; it never bundles. The rest of Tauri's
      # documented Linux list is therefore not needed here: librsvg2-dev and
      # patchelf are used by the deb/AppImage bundlers (and patchelf ships in
      # the runner image anyway), and the appindicator package is for a system
      # tray this app does not have (no tray in the source, and the `tauri`
      # dependency enables only `image-png`). The release workflow, which does
      # bundle, keeps the full set.
      #
      # The .deb files are cached in a workspace directory rather than
      # re-downloaded: /var/cache/apt is root-owned, which actions/cache cannot
      # read, so the download is redirected somewhere it can.
      - name: Cache the Tauri apt packages
        uses: actions/cache@v6
        with:
          path: .apt-cache
          key: apt-tauri-${{ runner.os }}-libwebkit2gtk-4.1-dev-v1

      - name: Install Tauri Linux system dependencies
        env:
          # A prompt would hang the step; the runner's unattended-upgrades can
          # hold the dpkg lock, so wait for it with a bound instead of forever
          # (which is how the release job's identical step hung for 19 minutes).
          DEBIAN_FRONTEND: noninteractive
        run: |
          mkdir -p .apt-cache
          sudo apt-get update -qq -o DPkg::Lock::Timeout=300
          # Download into the cached directory (or confirm it is already there),
          # then install strictly from it -- `--no-download` fails rather than
          # silently reaching for the network.
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$(pwd)/.apt-cache" \
            -o DPkg::Lock::Timeout=300 \
            --download-only libwebkit2gtk-4.1-dev
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$(pwd)/.apt-cache" \
            -o DPkg::Lock::Timeout=300 \
            --no-download libwebkit2gtk-4.1-dev
          # actions/cache runs as the unprivileged runner user.
          sudo chown -R "$(id -u):$(id -g)" .apt-cache

      - name: Set up Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Without this a failing run saves nothing, so the retry after a red
          # build recompiles the whole dependency graph from scratch.
          cache-on-failure: true

      # The Tauri app crate reads the git-ignored icon set at compile time
      # (include_bytes! + generate_context! + the resources glob). It is
      # generated from assets/icons/ by scripts/gen-icons.mjs; the crate's
      # build.rs regenerates it when missing, but a warm rust-cache skips
      # build.rs while the icons (not cached, not committed) are absent -- so
      # generate them explicitly here before any cargo step.
      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Set up Node.js 22 with pnpm cache
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate localization catalogs
        # The .ts (renderer) and .mo (Rust) catalogs are generated from
        # locales/*.po and are not committed. postinstall already runs this on
        # install, but do it explicitly so generation never silently depends on
        # the install lifecycle firing or on cache state.
        run: pnpm run i18n

      - name: Generate the desktop icon set
        run: pnpm run icons

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  e2e:
    name: End-to-end (CLI against the fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Nothing this job reads is LFS-tracked today, but fetch the blobs
          # anyway: if a fixture or an asset the CLI touches ever becomes
          # LFS-tracked, the suite would otherwise assert against ~130-byte
          # pointer files and fail in a thoroughly confusing way.
          lfs: true
          # The fixture submodule IS the subject here, so it must be present.
          # actions/checkout rewrites github.com SSH remotes to authenticated
          # HTTPS, so the submodule's SSH URL resolves without a deploy key.
          submodules: true

      - name: Set up Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Set up Node.js 22 with pnpm cache
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The suite drives only the CLI crate, which does not link the webview, so
      # the Tauri system libraries the `rust` job installs are not needed here.
      - name: Run the end-to-end suite
        # Pin the fixture to the commit this repository records: a CI run must be
        # reproducible and fail for reasons in the diff, not because the fixture
        # moved. Locally the same script force-pulls instead.
        env:
          SKILLKEEPER_E2E_PIN_FIXTURE: "1"
        run: pnpm test:e2e
